name: Temporary ptrace WSL2 experiment

on:
  push:
    branches:
      - research/ptrace-wsl2-20260824
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-linux-binaries:
    name: Build Linux probes
    runs-on: ubuntu-latest
    steps:
      - uses: taiki-e/checkout-action@7d1e50e93dc4fb3bba58f85018fadf77898aee8b # v1.4.2

      - name: Build exact descendant probe and inject_demo
        shell: bash
        run: |
          set -euxo pipefail
          mkdir -p target/ptrace-wsl2
          gcc -O2 -Wall -Wextra -Werror \
            -o target/ptrace-wsl2/ptrace-environment-probe \
            research/ptrace-environment-probe.c
          rustup target add x86_64-unknown-none
          cargo build --locked -p inject_demo
          cp target/debug/inject_demo target/ptrace-wsl2/inject_demo

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ptrace-wsl2-binaries
          path: target/ptrace-wsl2
          if-no-files-found: error
          retention-days: 1

  wsl2:
    name: Imported Ubuntu under WSL2
    needs: build-linux-binaries
    runs-on: windows-latest
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: ptrace-wsl2-binaries
          path: C:\fspy-ptrace-artifacts

      - name: Report Windows and WSL components
        run: |
          $ErrorActionPreference = 'Stop'
          Write-Host "ImageOS=$env:ImageOS ImageVersion=$env:ImageVersion"
          [System.Environment]::OSVersion.VersionString
          Get-ComputerInfo |
            Select-Object WindowsProductName, WindowsVersion, OsBuildNumber, HyperVisorPresent
          & wsl.exe --version
          if ($LASTEXITCODE -ne 0) { throw "wsl --version failed: $LASTEXITCODE" }
          & wsl.exe --status
          if ($LASTEXITCODE -ne 0) { throw "wsl --status failed: $LASTEXITCODE" }

      - name: Download and import official Ubuntu image as WSL2
        run: |
          $ErrorActionPreference = 'Stop'
          $imageUrl = 'https://releases.ubuntu.com/24.04/ubuntu-24.04.4-wsl-amd64.wsl'
          $image = 'C:\fspy-ptrace-artifacts\ubuntu-24.04.4-wsl-amd64.wsl'
          $installDir = 'C:\fspy-ptrace-wsl2'
          # From the signed Ubuntu 24.04 SHA256SUMS publication. The versioned
          # image and digest are intentionally pinned for this experiment.
          $expected = '9B2F7730DC68227DD04A9F3E5EAB86AD85CAF556B8606AD94F1F29FF5C4FD3F5'

          curl.exe --fail --location --retry 5 --output $image $imageUrl
          if ($LASTEXITCODE -ne 0) { throw "Ubuntu image download failed: $LASTEXITCODE" }
          $actual = (Get-FileHash -Algorithm SHA256 $image).Hash
          if ($actual -ne $expected) {
            throw "Ubuntu WSL image checksum mismatch: expected $expected, got $actual"
          }

          New-Item -ItemType Directory -Force $installDir | Out-Null
          & wsl.exe --import FspyPtraceProbe $installDir $image --version 2
          if ($LASTEXITCODE -ne 0) { throw "wsl --import failed: $LASTEXITCODE" }

          & wsl.exe --list --verbose
          if ($LASTEXITCODE -ne 0) { throw "wsl --list --verbose failed: $LASTEXITCODE" }
          # wsl.exe writes UTF-16 text even through this PowerShell pipeline.
          # Remove embedded NULs before matching the human-readable fields.
          $details = (& wsl.exe --list --verbose 2>&1 | Out-String).Replace("`0", '')
          if ($details -notmatch 'FspyPtraceProbe\s+Stopped\s+2' -and
              $details -notmatch 'FspyPtraceProbe\s+Running\s+2') {
            throw "Imported distribution was not reported as WSL version 2: $details"
          }

      - name: Run exact descendant ptrace probe in WSL2
        run: |
          $ErrorActionPreference = 'Stop'
          $script = @'
          set -euxo pipefail
          uname -a
          cat /proc/version
          cat /etc/os-release
          id
          grep -E '^(Cap(Inh|Prm|Eff|Bnd|Amb)|NoNewPrivs|Seccomp):' /proc/self/status
          if test -r /proc/sys/kernel/yama/ptrace_scope; then
            printf 'YamaScope='
            cat /proc/sys/kernel/yama/ptrace_scope
          else
            echo 'YamaScope=unavailable'
          fi
          printf 'PID1='
          tr '\0' ' ' </proc/1/cmdline
          echo

          install -m 0755 \
            /mnt/c/fspy-ptrace-artifacts/ptrace-environment-probe \
            /probe-normal
          cp /probe-normal /probe-suid
          chown root:root /probe-suid
          chmod 4755 /probe-suid
          if ! id fspyprobe >/dev/null 2>&1; then
            useradd --create-home --uid 1001 --shell /bin/bash fspyprobe
          fi

          echo '=== exact probe as unprivileged WSL2 user ==='
          runuser -u fspyprobe -- /probe-normal
          echo '=== setuid semantics as unprivileged WSL2 user ==='
          runuser -u fspyprobe -- /probe-normal suid-tests
          echo '=== exact probe as WSL2 root (diagnostic only) ==='
          /probe-normal
          '@
          & wsl.exe -d FspyPtraceProbe --user root -- bash -lc $script
          if ($LASTEXITCODE -ne 0) { throw "WSL2 descendant probe failed: $LASTEXITCODE" }

      - name: Run current inject_demo in WSL2
        run: |
          $ErrorActionPreference = 'Stop'
          $script = @'
          set -euxo pipefail
          install -m 0755 /mnt/c/fspy-ptrace-artifacts/inject_demo /usr/local/bin/inject_demo

          install -d -m 0700 /root/fspy-inject-run
          echo '=== inject_demo as WSL2 root ==='
          cd /root/fspy-inject-run
          /usr/local/bin/inject_demo

          install -d -m 0700 -o fspyprobe -g fspyprobe /home/fspyprobe/fspy-inject-run
          echo '=== inject_demo as unprivileged WSL2 user ==='
          runuser -u fspyprobe -- bash -lc \
            'cd /home/fspyprobe/fspy-inject-run && /usr/local/bin/inject_demo'
          '@
          & wsl.exe -d FspyPtraceProbe --user root -- bash -lc $script
          if ($LASTEXITCODE -ne 0) { throw "WSL2 inject_demo failed: $LASTEXITCODE" }

      - name: Unregister disposable WSL2 distribution
        if: always()
        run: |
          $ErrorActionPreference = 'Continue'
          & wsl.exe --terminate FspyPtraceProbe
          & wsl.exe --unregister FspyPtraceProbe
          Remove-Item -Recurse -Force -ErrorAction SilentlyContinue C:\fspy-ptrace-wsl2
          Remove-Item -Recurse -Force -ErrorAction SilentlyContinue C:\fspy-ptrace-artifacts
          $global:LASTEXITCODE = 0
