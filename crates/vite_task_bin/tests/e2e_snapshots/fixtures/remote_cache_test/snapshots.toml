[[e2e]]
name = "remote_cache_restores_across_machines"
comment = """
End-to-end remote caching against a real Cloudflare Worker running under local
`wrangler dev` (R2 + KV emulated). A `remote-cache-start` task launches the
worker and writes its (dynamic) URL and bearer token to a `.env` in the
workspace root; `vt run build` reads VITE_REMOTE_CACHE_URL / VITE_REMOTE_CACHE_TOKEN
from that `.env`, so the port and secret never appear in this snapshot.

This validates the cache UPDATE path end to end:
  1. the first build misses both caches, executes, and updates the cache;
  2. an immediate re-build is a LOCAL cache hit — proving the run updated the
     local cache;
  3. after wiping the local cache (simulating a fresh machine) the build still
     hits — proving the update was also pushed to the remote tier — and restores
     the output file from the remote archive.

Requires Node + wrangler (from packages/tools), so this case is `ignore`d and
runs only with `cargo test -- --include-ignored`.
"""
ignore = true
steps = [
  { argv = [
    "vt",
    "run",
    "remote-cache-start",
  ], comment = "launch the local wrangler dev worker; writes .env with the URL + token" },
  { argv = [
    "vt",
    "run",
    "build",
  ], comment = "first build — local + remote miss, executes and updates both caches" },
  { argv = [
    "vt",
    "run",
    "build",
  ], comment = "re-build, nothing changed — LOCAL cache hit proves the first run updated the cache" },
  { argv = [
    "vtt",
    "print-file",
    "dist/output.txt",
  ], comment = "output is on disk after the run" },
  { argv = [
    "vtt",
    "rm",
    "-rf",
    "dist",
  ], comment = "delete the output so a restore from the remote archive is observable" },
  { argv = [
    "vtt",
    "rm",
    "-rf",
    "node_modules/.vite/task-cache",
  ], comment = "wipe the LOCAL cache to simulate a fresh machine" },
  { argv = [
    "vt",
    "run",
    "build",
  ], comment = "empty local cache — this hit can only come from the remote tier the first run updated" },
  { argv = [
    "vtt",
    "print-file",
    "dist/output.txt",
  ], comment = "output restored from the remote archive" },
  { argv = [
    "vt",
    "run",
    "remote-cache-stop",
  ], comment = "shut the worker down" },
]
